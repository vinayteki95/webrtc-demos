<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNAL // 1:1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div class="app">
        <header class="hud-header">
            <p class="hud-kicker">WEB RTC / WEBSOCKET SIGNALING</p>
            <h1 class="title">SIGNAL<span class="title-slash"> // </span>1:1<span class="caret" aria-hidden="true"></span></h1>
            <p class="hud-status" id="hud-status">STANDBY</p>
            <div class="identity" title="This tab's signaling id — copy it into the other tab">
                <span class="identity__label">YOUR ID</span>
                <code class="identity__value" id="client-id">—</code>
                <button type="button" class="btn btn--ghost btn--sm" id="btn-copy-id">Copy</button>
            </div>
        </header>

        <div class="layout">
            <main class="main">
                <section id="view-home" class="view view--home">
                    <p class="panel-lead">
                        Open this page in two tabs. Copy <strong>YOUR ID</strong> from the callee tab into the field below, then Start Call. Incoming offers are answered automatically.
                    </p>

                    <label class="field-label" for="peer-id">Callee client-id</label>
                    <input class="id-input" id="peer-id" type="text" autocomplete="off" spellcheck="false" placeholder="Paste the other tab’s YOUR ID">

                    <button type="button" class="btn btn--primary btn--pulse" id="btn-start-call">
                        <span class="btn-glow"></span>
                        Start Call
                    </button>
                </section>

                <section id="view-call" class="view view--call" hidden>
                    <div class="stage-videos">
                        <figure class="video-frame">
                            <figcaption class="video-label">LOCAL</figcaption>
                            <video id="video-local" autoplay playsinline muted></video>
                            <span class="video-corner video-corner--tl"></span>
                            <span class="video-corner video-corner--tr"></span>
                            <span class="video-corner video-corner--bl"></span>
                            <span class="video-corner video-corner--br"></span>
                        </figure>
                        <figure class="video-frame video-frame--remote">
                            <figcaption class="video-label video-label--live">REMOTE <span class="live-badge">LIVE</span></figcaption>
                            <video id="video-remote" autoplay playsinline></video>
                            <span class="video-corner video-corner--tl"></span>
                            <span class="video-corner video-corner--tr"></span>
                            <span class="video-corner video-corner--bl"></span>
                            <span class="video-corner video-corner--br"></span>
                        </figure>
                    </div>
                    <button type="button" class="btn btn--danger btn--pulse" id="btn-hangup">
                        Cancel Call
                    </button>
                </section>
            </main>

            <aside class="sidebar" aria-label="Peer connection states">
                <h2 class="sidebar-title">PEER STATE</h2>

                <div class="state-card" id="card-connection" data-state="—">
                    <span class="led"></span>
                    <div>
                        <p class="state-card__name">connectionState</p>
                        <p class="state-card__value" id="state-connection">—</p>
                    </div>
                </div>

                <div class="state-card" id="card-gathering" data-state="—">
                    <span class="led"></span>
                    <div>
                        <p class="state-card__name">iceGatheringState</p>
                        <p class="state-card__value" id="state-gathering">—</p>
                    </div>
                </div>

                <div class="state-card" id="card-signaling" data-state="—">
                    <span class="led"></span>
                    <div>
                        <p class="state-card__name">signalingState</p>
                        <p class="state-card__value" id="state-signaling">—</p>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
